<!DOCTYPE html>
<html lang="es">
<head>

    <title>Calculadora de IVA</title>
</head>
<body>

    <h1>Calculadora de Precio con IVA (13%)</h1>

    <h2>1. Ingrese el precio base:</h2>
    <input type="number" id="montoBase">

    <br><br>

    <button type="button" id="btnCalcular">Calcular Precio Final</button>

    <h2 id="resultadoBase">Precio base: 0</h2>
    <h2 id="resultadoIva">IVA (13%): 0</h2>
    <h2 id="resultadoFinal">Precio final: 0</h2>

    <script src="script.js" defer></script>
    
</body>
